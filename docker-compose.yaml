networks:
  backend:

services:
  mssql:
    image: mcr.microsoft.com/mssql/server
    container_name: mssql-data
    restart: always
    networks:
      - backend
    ports:
      - 1433:1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_USER=sa
      - MSSQL_PID=Developer

  restuarantapi:
    image: ${DOCKER_REGISTRY-}restuarantdemoapi
    container_name: restuarant-api
    networks:
      - backend
    build:
      context: . # context at the root is the path containing the compose file
      dockerfile: Demo.Restuarants.API/Dockerfile
    ports:
      - 5017:80
    depends_on:
      - mssql
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Docker